services:
  db:
    image: postgres:16-alpine
    container_name: flux_postgres
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
      POSTGRES_DB: flux_analysis
    ports:
      - "5433:5432"
    volumes:
      - flux_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux -d flux_analysis"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: flux_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://flux:flux@db:5432/flux_analysis
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  flux_pg_data:
